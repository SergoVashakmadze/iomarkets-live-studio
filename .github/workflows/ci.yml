name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: deploy/requirements.txt matches uv.lock
        run: |
          uv export --no-dev --no-hashes --no-emit-project --format requirements-txt -q > /tmp/req.txt
          diff -u deploy/requirements.txt /tmp/req.txt
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # Tests replay recorded responses; no META_API_KEY is needed or set.
      - run: uv run pytest -q
