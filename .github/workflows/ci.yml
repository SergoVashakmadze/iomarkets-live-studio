name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # The Ubuntu mirror has stalled this step for 10+ minutes: cap each try and retry.
      - name: Install ffmpeg
        run: |
          for try in 1 2 3; do
            timeout 240 sudo apt-get -o Acquire::Retries=3 update -q \
              && timeout 240 sudo apt-get -o Acquire::Retries=3 install -y -q --no-install-recommends ffmpeg \
              && exit 0
            echo "apt attempt $try failed; retrying"
          done
          exit 1
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: deploy/requirements.txt matches uv.lock
        run: |
          uv export --no-dev --no-hashes --no-emit-project --format requirements-txt -q > /tmp/req.txt
          diff -u deploy/requirements.txt /tmp/req.txt
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # Tests replay recorded responses; no META_API_KEY is needed or set.
      - run: uv run pytest -q
