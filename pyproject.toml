[project]
name = "iomarkets-live-studio"
version = "0.1.0"
description = "A live business-news interview studio on Meta's models"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.9",
    # httpx pulls certifi in; 2026.10.23 dropped emSign roots (CLAUDE.md, eMudhra compromise).
    "certifi>=2026.10.23",
    "websockets>=14",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "meta-sam-parser>=0.1.0",
    "numpy>=2.1",
]

[project.scripts]
studio = "studio.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/studio"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
